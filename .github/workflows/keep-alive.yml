# Supabase pauses free projects after 7 days without a database request.
# A quiet week on every client blog would otherwise lock clients out of the
# portal and fail every site build. One cheap query a day prevents that.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
